<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms reads these at deploy time; the site's own forms post here (see src/lib/forms.ts).
     Each submission emails you (Netlify notifications) and goes to the editor desk (outgoing webhook). -->
<form name="visit" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="site"><input name="venue"><input name="page"><input name="league">
  <textarea name="message"></textarea><input name="when"><input name="rating"><input type="file" name="photo">
  <input name="name"><input type="email" name="email"><input type="checkbox" name="ok-to-publish" value="yes">
</form>
<form name="fix" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="site"><input name="venue"><input name="page">
  <textarea name="message"></textarea><input name="source"><input type="email" name="email">
</form>
<form name="count-share" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="site"><input name="name"><input name="method"><input name="count">
  <input name="states"><textarea name="visited"></textarea><input name="link">
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="site"><input name="name"><input type="email" name="email">
  <input name="business"><input name="topic"><textarea name="message"></textarea>
</form>
</body>
</html>
