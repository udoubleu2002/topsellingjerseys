# Netlify builds this Next.js app with its Next.js runtime (added automatically when it detects Next.js).
# Deploy from Git or with `npx netlify-cli deploy --build --prod`; drag-and-drop of this folder will not build it.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Jersey photos from the Lids feed are resized and cached by the Netlify Image CDN (see src/lib/img.ts).
[images]
  remote_images = ["https://feeds\\.frgimages\\.com/.*"]

# After each production deploy, pre-load every jersey photo through the Image CDN so first visitors don't wait on resizes.
[[plugins]]
  package = "/netlify/plugins/warm-images"
