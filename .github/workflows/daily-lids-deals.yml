# Refreshes data/promotions.json from the Impact.com partner API every morning and commits it,
# which redeploys the site with today's Lids deals in the top bar.
# Repository secrets: IMPACT_ACCOUNT_SID, IMPACT_AUTH_TOKEN, and IMPACT_LIDS_CAMPAIGN_ID (or AFFILIATE_DEEPLINK_LIDS).
name: Daily Lids deals
on:
  schedule:
    - cron: "15 11 * * *" # 6:15am US Eastern (standard time)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run deals:fetch
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          IMPACT_LIDS_CAMPAIGN_ID: ${{ secrets.IMPACT_LIDS_CAMPAIGN_ID }}
          AFFILIATE_DEEPLINK_LIDS: ${{ secrets.AFFILIATE_DEEPLINK_LIDS }}
      - run: npm run validate
      - name: Commit if deals changed
        run: |
          git diff --quiet data/promotions.json && { echo "No change."; exit 0; }
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/promotions.json
          git commit -m "Refresh Lids deals $(date -u +%F)"
          git push
