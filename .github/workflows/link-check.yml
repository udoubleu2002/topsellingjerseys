# Weekly dead-link check: builds the site, crawls every page, and checks internal pages, shop/ad redirects and
# every outside link (sources, retailer pages, images). Runs on GitHub's network, since outside sites can't be
# reached from every build environment. Can also be started by hand from the Actions tab.
name: Link check
on:
  schedule:
    - cron: "30 12 * * 1" # Mondays, 7:30am US Eastern
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/check-site-links.mjs
      - .github/workflows/link-check.yml
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
      - run: node scripts/check-site-links.mjs
        env:
          BASE: http://localhost:3000
